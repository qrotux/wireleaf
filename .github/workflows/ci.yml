name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - name: gofmt + vet + tests (all modules)
        run: bash scripts/check.sh
      - name: race
        run: bash scripts/check.sh -race

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "reflector", "apidoc/crosscheck", "adapters/huma", "examples"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: '**/go.sum'
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          working-directory: ${{ matrix.module }}
